name: weltmodelle

services:
  lewm:
    build:
      context: .
      dockerfile: Dockerfile
    image: weltmodelle-lewm:local
    container_name: weltmodelle-lewm
    working_dir: /workspace/ws_le-wm/le-wm
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # Do not auto-start on host boot. ./run.sh starts it; compose stop on session exit.
    restart: "no"
    stop_grace_period: 30s
    stop_signal: SIGTERM
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8gb
    stdin_open: true
    tty: true
    init: true
    # DRI nodes: card* → video (44), renderD* → render (110) on this host.
    # UIDs/GIDs come from run.sh so ACLs and group bits match the workstation.
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-110}"
    devices:
      - /dev/dri
    # Whole workspace on the host. No named/anonymous Docker volumes.
    # Work lives on this bind; the container is not auto-restarted.
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      HOME: /workspace/docker/home
      VIRTUAL_ENV: /opt/venv
      # compose exec does not re-run entrypoint; PATH must include the image venv.
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
      STABLEWM_HOME: /workspace/ws_le-wm/stablewm
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      DISPLAY: ${DISPLAY:-:0}
      TERM: xterm-256color
    command: ["sleep", "infinity"]
