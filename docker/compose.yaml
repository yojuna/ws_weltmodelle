name: weltmodelle

services:
  lewm:
    build:
      context: .
      dockerfile: Dockerfile
    image: weltmodelle-lewm:local
    container_name: weltmodelle-lewm
    working_dir: /workspace/ws_le-wm/le-wm
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 8gb
    stdin_open: true
    tty: true
    init: true
    # Whole workspace on the host. No named/anonymous Docker volumes.
    # Container is kept (restart: unless-stopped); work lives on this bind.
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      HOME: /workspace/docker/home
      VIRTUAL_ENV: /opt/venv
      # compose exec does not re-run entrypoint; PATH must include the image venv.
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
      STABLEWM_HOME: /workspace/ws_le-wm/stablewm
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      DISPLAY: ${DISPLAY:-:0}
      TERM: xterm-256color
    command: ["sleep", "infinity"]
